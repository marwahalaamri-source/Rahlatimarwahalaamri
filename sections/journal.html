<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem("rahlati:theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دفتري اليومي — رحلتي</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preload" as="image" href="../assets/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Almarai:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0d1426;
    --navy-900:#101a30;
    --navy-800:#16223d;
    --gold:#c9b28c;
    --gold-deep:#b3986e;
    --gold-soft:#e8dcc6;
    --ivory:#f8f4ec;
    --glass:rgba(16,26,48,.42);
    --hairline:rgba(201,178,140,.22);
    --ink-rgb:13,20,38;
    --paper-rgb:248,244,236;
    --glass-rgb:16,26,48;
    --shadow-rgb:8,12,24;
    --accent-navy-rgb:30,41,70;
    --font-display:"Amiri", serif;
    --font-body:"Almarai", sans-serif;
  }
  :root[data-theme="light"]{
    --navy-950:#f7f4ee;
    --navy-900:#fffdf9;
    --navy-800:#efe7d8;
    --gold-soft:#93794c;
    --ivory:#332c22;
    --glass:rgba(255,255,255,.82);
    --hairline:rgba(201,178,140,.35);
    --ink-rgb:247,243,235;
    --paper-rgb:51,44,34;
    --glass-rgb:255,255,255;
    --shadow-rgb:120,100,70;
    --accent-navy-rgb:230,214,186;
  }
  *{
    margin:0;padding:0;box-sizing:border-box;
    transition:background-color .3s ease, background-image .3s ease, border-color .3s ease, box-shadow .3s ease, color .3s ease;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font-body);background:var(--navy-950);color:var(--ivory);
    overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(201,178,140,.35);color:var(--ivory)}
  ::placeholder{color:rgba(var(--paper-rgb),.35);font-weight:300}

  /* الخلفية المستمرة */
  .bg{position:fixed;inset:0;z-index:-3;overflow:hidden}
  .bg img{width:100%;height:100%;object-fit:cover;object-position:center 62%;transform:scale(1.06)}
  .bg-tint{
    position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:linear-gradient(180deg, rgba(var(--ink-rgb),.55) 0%, rgba(var(--ink-rgb),.42) 30%, rgba(var(--ink-rgb),.6) 70%, rgba(var(--ink-rgb),.85) 100%);
  }

  /* التنقّل */
  .nav{
    position:fixed;top:0;right:0;left:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:.8rem clamp(1.25rem,4vw,3.5rem);
    background:rgba(var(--ink-rgb),.62);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(201,178,140,.14);
  }
  .brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
  .brand img{width:38px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.25))}
  .brand span{font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--ivory);padding-top:.2em}
  .nav-back{
    display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;
    color:rgba(var(--paper-rgb),.85);font-weight:300;font-size:.92rem;
    padding:.5rem 1.2rem;border:1px solid rgba(var(--paper-rgb),.22);border-radius:99px;
    transition:border-color .3s, color .3s;
  }
  .nav-back:hover{border-color:var(--gold);color:var(--gold-soft)}
  .nav-left{display:flex;align-items:center;gap:.9rem}
  .theme-toggle{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;cursor:pointer;
    border:1px solid rgba(201,178,140,.3);background:rgba(var(--glass-rgb),.25);
    display:flex;align-items:center;justify-content:center;font-size:1.05rem;line-height:1;
    transition:background-color .3s ease, border-color .3s ease, transform .3s ease;
  }
  .theme-toggle:hover{border-color:var(--gold);transform:translateY(-1px)}

  .wrap{max-width:1180px;margin:0 auto;padding:6.5rem clamp(1rem,4vw,2.5rem) 4rem}

  /* ————— رأس الدفتر ————— */
  .day-head{text-align:center;padding:1.8rem 0 1.4rem;position:relative}
  .saved-flag{
    position:absolute;top:1.9rem;left:0;display:flex;align-items:center;gap:.4rem;
    font-size:.78rem;font-weight:300;color:var(--gold-soft);
    opacity:0;transition:opacity .5s ease;
  }
  .saved-flag.show{opacity:1}
  @media (max-width:900px){ .saved-flag{position:static;justify-content:center;margin-top:.6rem} }

  .focus-ref{
    max-width:1180px;margin:0 auto 1.4rem;padding:.9rem 1.5rem;border-radius:18px;
    background:rgba(201,178,140,.08);border:1px solid rgba(201,178,140,.28);
    display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  }
  .focus-ref .fr-text{font-size:.92rem;color:var(--gold-soft);font-weight:400}
  .focus-ref .fr-text b{font-family:var(--font-display);color:var(--ivory);font-weight:700}
  .focus-check{
    display:flex;gap:.5rem;flex-wrap:wrap;
  }
  .focus-check button{
    padding:.4rem 1rem;border-radius:99px;border:1px solid rgba(201,178,140,.35);
    background:rgba(var(--ink-rgb),.3);color:rgba(var(--paper-rgb),.8);font-size:.82rem;font-weight:300;
    cursor:pointer;transition:background .3s, border-color .3s, color .3s;
  }
  .focus-check button.on{background:linear-gradient(135deg,#e3cfa5,#b3986e);color:#221d12;border-color:transparent;font-weight:700}

  .goal-ref{margin-top:.7rem}
  .goal-ref .gr-label{font-size:.8rem;font-weight:300;color:var(--gold);margin-bottom:.5rem}
  .goal-ref .gr-chips{display:flex;flex-wrap:wrap;gap:.5rem}
  .goal-ref .gr-chip{
    padding:.4rem 1rem;border-radius:99px;border:1px solid rgba(201,178,140,.3);
    background:rgba(var(--ink-rgb),.3);color:rgba(var(--paper-rgb),.75);font-size:.82rem;font-weight:300;
    cursor:pointer;transition:background .3s, border-color .3s, color .3s;
  }
  .goal-ref .gr-chip.on{background:rgba(201,178,140,.2);border-color:var(--gold);color:var(--gold-soft)}
  .goal-ref .gr-empty{font-size:.82rem;font-weight:300;color:rgba(var(--paper-rgb),.45)}
  .day-head .greet{
    font-weight:300;font-size:1rem;color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;gap:.9rem;
  }
  .day-head .greet::before,.day-head .greet::after{
    content:"";width:36px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));
  }
  .day-head .greet::after{background:linear-gradient(90deg,var(--gold),transparent)}
  .day-head h1{
    font-family:var(--font-display);font-weight:700;
    font-size:clamp(2.3rem,6vw,3.6rem);line-height:1.6;margin:.5rem 0 .1rem;
  }
  .day-head .sub{font-weight:300;font-size:.95rem;color:rgba(var(--paper-rgb),.65)}
  .day-head .dquote{
    margin-top:1.1rem;font-family:var(--font-display);font-size:1.15rem;color:var(--gold-soft);
  }

  /* ————— التقويم والبحث ————— */
  .toolbar{
    display:grid;grid-template-columns:1fr 340px;gap:1.2rem;align-items:start;margin:1.2rem 0 2.4rem;
  }
  .panel{
    background:var(--glass);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid var(--hairline);border-radius:26px;
    box-shadow:0 18px 50px rgba(var(--shadow-rgb),.26), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .cal{padding:1.3rem 1.5rem 1.5rem}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
  .cal-title{font-family:var(--font-display);font-weight:700;font-size:1.25rem}
  .cal-nav{display:flex;gap:.5rem}
  .cal-btn{
    width:34px;height:34px;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(201,178,140,.35);background:rgba(201,178,140,.07);
    color:var(--gold);font-size:1rem;transition:background .3s, border-color .3s;
  }
  .cal-btn:hover{background:rgba(201,178,140,.18);border-color:var(--gold)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;text-align:center}
  .cal-grid .wd{font-size:.72rem;font-weight:300;color:var(--gold);padding-bottom:.4rem}
  .cal-day{
    position:relative;height:38px;border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:.88rem;color:rgba(var(--paper-rgb),.85);border:1px solid transparent;
    transition:background .25s, border-color .25s;
  }
  .cal-day:hover{background:rgba(201,178,140,.1)}
  .cal-day.out{opacity:.28;pointer-events:none}
  .cal-day.today{border-color:rgba(201,178,140,.5)}
  .cal-day.sel{background:linear-gradient(135deg,#e3cfa5,#b3986e);color:#221d12;font-weight:700}
  .cal-day.has::after{
    content:"";position:absolute;bottom:5px;right:50%;transform:translateX(50%);
    width:4px;height:4px;border-radius:50%;background:var(--gold);
  }
  .cal-day.sel.has::after{background:#221d12}

  .search{padding:1.3rem 1.5rem;position:relative}
  .search label{display:block;font-size:.8rem;font-weight:300;color:var(--gold);margin-bottom:.6rem}
  .search-box{position:relative}
  .search input{
    width:100%;background:rgba(var(--ink-rgb),.4);border:1px solid rgba(201,178,140,.25);
    border-radius:14px;padding:.75rem 2.6rem .75rem 1rem;color:var(--ivory);
    font-family:var(--font-body);font-weight:300;font-size:.92rem;outline:none;
    transition:border-color .3s;
  }
  .search input:focus{border-color:var(--gold)}
  .search-box svg{
    position:absolute;top:50%;right:.9rem;transform:translateY(-50%);
    width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.6;opacity:.8;
  }
  .results{margin-top:.8rem;display:flex;flex-direction:column;gap:.45rem;max-height:220px;overflow-y:auto}
  .results:empty{display:none}
  .result{
    text-align:right;background:rgba(var(--ink-rgb),.35);border:1px solid rgba(201,178,140,.16);
    border-radius:12px;padding:.6rem .9rem;cursor:pointer;color:var(--ivory);
    font-family:var(--font-body);transition:border-color .3s;
  }
  .result:hover{border-color:var(--gold)}
  .result .r-date{font-size:.72rem;color:var(--gold);font-weight:300}
  .result .r-text{font-size:.85rem;font-weight:300;color:rgba(var(--paper-rgb),.8);line-height:1.8}
  .result .r-text mark{background:rgba(201,178,140,.35);color:var(--ivory);border-radius:3px;padding:0 .15em}
  .no-results{font-size:.82rem;font-weight:300;color:rgba(var(--paper-rgb),.5);padding:.4rem .2rem}

  /* ————— الدفتر المفتوح ————— */
  .notebook{
    position:relative;
    display:grid;grid-template-columns:1fr 1fr;
    background:var(--glass);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid var(--hairline);border-radius:32px;
    box-shadow:0 24px 70px rgba(var(--shadow-rgb),.3), inset 0 1px 0 rgba(255,255,255,.06);
    overflow:hidden;
  }
  .notebook::before{ /* كعب الدفتر */
    content:"";position:absolute;top:4%;bottom:4%;right:50%;width:1px;
    background:linear-gradient(180deg,transparent,rgba(201,178,140,.4),rgba(201,178,140,.4),transparent);
  }
  .page{padding:clamp(1.6rem,3.5vw,2.8rem)}
  .page + .page{border-right:none}

  .block{margin-bottom:2.2rem}
  .block:last-child{margin-bottom:0}
  .block-label{
    display:flex;align-items:center;gap:.6rem;
    font-size:.82rem;font-weight:300;color:var(--gold);margin-bottom:1rem;
  }
  .block-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,178,140,.35),transparent)}
  .block-label .icon{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.4}

  /* المزاج */
  .moods{display:flex;justify-content:space-between;gap:.4rem}
  .mood{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;
    background:none;border:none;cursor:pointer;padding:.4rem .2rem;border-radius:16px;
    transition:background .3s;
  }
  .mood:hover{background:rgba(201,178,140,.07)}
  .mood .face{
    width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(201,178,140,.35);
    display:flex;align-items:center;justify-content:center;
    transition:background .3s, border-color .3s, transform .3s;
  }
  .mood .face svg{width:26px;height:26px;stroke:var(--gold-soft);fill:none;stroke-width:1.5;stroke-linecap:round}
  .mood span{font-size:.72rem;font-weight:300;color:rgba(var(--paper-rgb),.65)}
  .mood.sel .face{
    background:linear-gradient(135deg,#e3cfa5,#b3986e);border-color:transparent;transform:scale(1.08);
    box-shadow:0 8px 22px rgba(179,152,110,.4);
  }
  .mood.sel .face svg{stroke:#221d12}
  .mood.sel span{color:var(--gold-soft)}

  /* الحقول */
  .line-input{
    width:100%;background:none;border:none;outline:none;color:var(--ivory);
    font-family:var(--font-body);font-weight:300;font-size:1rem;
    padding:.55rem .1rem;border-bottom:1px solid rgba(201,178,140,.25);
    transition:border-color .3s;
  }
  .line-input:focus{border-bottom-color:var(--gold)}
  .intent .line-input{font-family:var(--font-display);font-size:1.15rem}

  .prio{display:flex;align-items:baseline;gap:.9rem}
  .prio + .prio{margin-top:.4rem}
  .prio .n{font-family:var(--font-display);color:var(--gold);font-size:1rem;min-width:1.4em}

  /* المهام */
  .tasks{display:flex;flex-direction:column;gap:.3rem}
  .task{
    display:flex;align-items:center;gap:.8rem;padding:.5rem .4rem;border-radius:12px;
    transition:background .25s;
  }
  .task:hover{background:rgba(201,178,140,.06)}
  .tick{
    width:22px;height:22px;border-radius:50%;flex-shrink:0;cursor:pointer;
    border:1px solid rgba(201,178,140,.45);background:none;
    display:flex;align-items:center;justify-content:center;
    transition:background .25s, border-color .25s;
  }
  .tick svg{width:11px;height:11px;stroke:#221d12;stroke-width:2.4;fill:none;opacity:0;transition:opacity .2s}
  .task.done .tick{background:linear-gradient(135deg,#e3cfa5,#b3986e);border-color:transparent}
  .task.done .tick svg{opacity:1}
  .task .t-text{
    flex:1;font-weight:300;font-size:.97rem;color:var(--ivory);outline:none;
    border-bottom:1px dashed transparent;line-height:1.9;
  }
  .task .t-text:focus{border-bottom-color:rgba(201,178,140,.4)}
  .task.done .t-text{color:rgba(var(--paper-rgb),.45);text-decoration:line-through;text-decoration-color:rgba(201,178,140,.5)}
  .task .del{
    background:none;border:none;cursor:pointer;color:rgba(var(--paper-rgb),.35);
    font-size:1rem;padding:.2rem .4rem;opacity:0;transition:opacity .25s, color .25s;
  }
  .task:hover .del{opacity:1}
  .task .del:hover{color:#d99}
  .add-task{display:flex;align-items:center;gap:.8rem;margin-top:.6rem}
  .add-task .plus{
    width:22px;height:22px;border-radius:50%;border:1px dashed rgba(201,178,140,.5);
    color:var(--gold);display:flex;align-items:center;justify-content:center;
    font-size:.95rem;flex-shrink:0;background:none;cursor:pointer;transition:background .3s;
  }
  .add-task .plus:hover{background:rgba(201,178,140,.15)}
  .add-task input{
    flex:1;background:none;border:none;outline:none;color:var(--ivory);
    font-family:var(--font-body);font-weight:300;font-size:.97rem;padding:.4rem 0;
  }

  /* الورق المسطّر */
  .ruled{
    width:100%;min-height:170px;resize:vertical;background:none;border:none;outline:none;
    color:var(--ivory);font-family:var(--font-body);font-weight:300;font-size:.98rem;
    line-height:2.3em;
    background-image:repeating-linear-gradient(transparent, transparent calc(2.3em - 1px), rgba(201,178,140,.16) calc(2.3em - 1px), rgba(201,178,140,.16) 2.3em);
    background-attachment:local;
  }
  .ruled.tall{min-height:230px}

  /* الامتنان */
  .grat{display:flex;align-items:baseline;gap:.8rem}
  .grat + .grat{margin-top:.4rem}
  .grat .star{color:var(--gold);font-size:.8rem}

  /* صورة اليوم */
  .photo-zone{
    border:1px dashed rgba(201,178,140,.5);border-radius:18px;cursor:pointer;
    min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.6rem;color:rgba(var(--paper-rgb),.55);font-size:.85rem;font-weight:300;
    background:rgba(var(--ink-rgb),.25);transition:border-color .3s, background .3s;position:relative;overflow:hidden;
  }
  .photo-zone:hover{border-color:var(--gold);background:rgba(201,178,140,.06)}
  .photo-zone svg{width:30px;height:30px;stroke:var(--gold);fill:none;stroke-width:1.3;opacity:.9}
  .photo-zone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photo-zone .remove{
    position:absolute;top:.6rem;left:.6rem;z-index:2;
    width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(var(--ink-rgb),.75);color:var(--ivory);font-size:.9rem;display:none;
  }
  .photo-zone.filled .remove{display:block}
  .photo-zone.filled .hint{display:none}

  /* التقييم */
  .stars{display:flex;gap:.5rem;justify-content:center;margin-bottom:1rem}
  .star-btn{background:none;border:none;cursor:pointer;padding:.2rem;transition:transform .25s}
  .star-btn:hover{transform:scale(1.15)}
  .star-btn svg{width:30px;height:30px;fill:none;stroke:rgba(201,178,140,.55);stroke-width:1.3;transition:fill .25s, stroke .25s}
  .star-btn.on svg{fill:var(--gold);stroke:var(--gold-deep);filter:drop-shadow(0 2px 8px rgba(201,178,140,.45))}

  /* الحفظ */
  .save-row{display:flex;justify-content:center;margin:2.6rem 0 0}
  .btn-gold{
    display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;cursor:pointer;
    border:none;border-radius:999px;padding:1rem 3.2rem;font-family:var(--font-body);
    font-weight:700;font-size:1.02rem;color:#221d12;
    background:linear-gradient(135deg,#e3cfa5 0%,#c9b28c 45%,#ab8f63 100%);
    box-shadow:0 14px 38px rgba(179,152,110,.4), inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .35s, box-shadow .35s;
  }
  .btn-gold:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(179,152,110,.5), inset 0 1px 0 rgba(255,255,255,.45)}

  .toast{
    position:fixed;bottom:2rem;right:50%;transform:translateX(50%) translateY(20px);
    background:rgba(var(--ink-rgb),.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(201,178,140,.4);border-radius:99px;
    padding:.8rem 1.8rem;font-size:.9rem;font-weight:300;color:var(--gold-soft);
    opacity:0;pointer-events:none;transition:opacity .4s, transform .4s;z-index:80;
  }
  .toast.show{opacity:1;transform:translateX(50%) translateY(0)}

  footer{text-align:center;padding:3rem 1rem 2.2rem;font-weight:300;font-size:.8rem;color:rgba(var(--paper-rgb),.45)}
  footer .fstar{color:var(--gold);display:block;margin-bottom:.5rem}

  .reveal{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.22,1,.36,1), transform 1s cubic-bezier(.22,1,.36,1)}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .reveal{opacity:1;transform:none}
  }

  /* ————— الجوال ————— */
  @media (max-width:900px){
    .wrap{padding-top:5.5rem}
    .toolbar{grid-template-columns:1fr}
    .notebook{grid-template-columns:1fr}
    .notebook::before{display:none}
    .page + .page{border-top:1px solid rgba(201,178,140,.22)}
    .moods{flex-wrap:wrap;justify-content:center}
    .mood{flex:0 0 30%}
    .cal-day{height:42px;border-radius:14px}
    .day-head h1{font-size:2.2rem}
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><img src="../assets/hero.jpg" alt=""></div>
<div class="bg-tint" aria-hidden="true"></div>

<nav class="nav">
  <div class="nav-left">
    <a href="../index.html" class="brand">
      <img src="../assets/logo.png" alt="شعار رحلتي">
      <span>رحلتي</span>
    </a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="تبديل المظهر">🌙</button>
  </div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/quotes.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
  const arabicNum = window.RahlatiStore.arabicNum;
  const iso = d => d.toISOString().slice(0,10);
  const toast = msg => {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2600);
  };
  function debounce(fn, ms){
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); };
  }

  const store = window.RahlatiStore.load();

  function blankEntry(date){
    return {date, mood:"", intent:"", priorities:["","",""], tasks:[], plan:"",
      diary:"", gratitude:["","",""], proud:"", photo:"", rating:0, note:"", linkedGoalId:null};
  }
  function findEntry(date){ return store.journal.find(e=>e.date===date); }
  function commitEntry(){
    if (!findEntry(state.date)) store.journal.push(state);
    window.RahlatiStore.touch(store, "journal");
    window.RahlatiStore.save(store);
    flashSaved();
  }
  const commitSoon = debounce(commitEntry, 500);
  let flashTimer;
  function flashSaved(){
    const el = document.getElementById("savedFlag");
    if (!el) return;
    el.classList.add("show");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(()=> el.classList.remove("show"), 1600);
  }

  let selected = iso(new Date());
  let state = null; // تدوينة اليوم المعروض حاليًا (مرجع مباشر لعنصر داخل store.journal أو مسودة جديدة)

  /* ————— الرأس: تاريخ وتحية واقتباس ————— */
  const monthsAr = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  function renderHead(){
    const d = new Date(selected + "T12:00:00");
    const today = iso(new Date()) === selected;
    const wd = new Intl.DateTimeFormat("ar", {weekday:"long"}).format(d);
    document.getElementById("dayTitle").textContent = today ? "دفتري اليومي — اليوم" : wd;
    let sub = new Intl.DateTimeFormat("ar-u-nu-arab", {weekday:"long", day:"numeric", month:"long", year:"numeric"}).format(d);
    try{
      const hijri = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", {day:"numeric", month:"long", year:"numeric"}).format(d);
      sub += " — " + hijri;
    }catch(e){}
    document.getElementById("daySub").textContent = sub;

    const h = new Date().getHours();
    let g = "أهلًا، مروه 🌿";
    if (h >= 4 && h < 12) g = "صباحُ النور، مروه 🌿";
    else if (h >= 12 && h < 17) g = "نهاركِ سعيد، مروه 🌿";
    else if (h >= 17 && h < 22) g = "مساءُ الورد، مروه 🌿";
    else g = "ليلتكِ هادئة، مروه 🌿";
    document.getElementById("greet").textContent = g;

    const Q = window.RAHLATI_QUOTES || [{t:"كلُّ يومٍ هو بدايةٌ جديدة"}];
    const q = Q[Math.floor(new Date(selected+"T12:00:00").getTime() / 86400000) % Q.length];
    document.getElementById("dayQuote").textContent = "«" + q.t + "»";
  }

  /* ————— التقويم ————— */
  let calY, calM;
  (function(){ const d = new Date(); calY = d.getFullYear(); calM = d.getMonth(); })();
  const WD = ["س","ح","ن","ث","ر","خ","ج"]; // السبت أولًا
  function renderCal(){
    document.getElementById("calTitle").textContent = monthsAr[calM] + " " + arabicNum(calY);
    const grid = document.getElementById("calGrid");
    grid.innerHTML = WD.map(w=>`<span class="wd">${w}</span>`).join("");
    const first = new Date(calY, calM, 1);
    const daysIn = new Date(calY, calM+1, 0).getDate();
    // عمود البداية: السبت=0 … الجمعة=6
    const startCol = (first.getDay() + 1) % 7;
    const todayISO = iso(new Date());
    let html = "";
    for(let i=0;i<startCol;i++) html += `<span class="cal-day out"></span>`;
    for(let day=1;day<=daysIn;day++){
      const dISO = iso(new Date(Date.UTC(calY, calM, day)));
      const cls = ["cal-day"];
      if (dISO === todayISO) cls.push("today");
      if (dISO === selected) cls.push("sel");
      if (store.journal.some(e=>e.date===dISO)) cls.push("has");
      html += `<span class="${cls.join(" ")}" data-d="${dISO}">${arabicNum(day)}</span>`;
    }
    grid.insertAdjacentHTML("beforeend", html);
    grid.querySelectorAll(".cal-day[data-d]").forEach(el=>{
      el.addEventListener("click", ()=>{ selectDay(el.dataset.d); });
    });
  }
  document.getElementById("calPrev").addEventListener("click", ()=>{ calM--; if(calM<0){calM=11;calY--;} renderCal(); });
  document.getElementById("calNext").addEventListener("click", ()=>{ calM++; if(calM>11){calM=0;calY++;} renderCal(); });

  /* ————— الدفتر: تعبئة وتفريغ ————— */
  const $ = id => document.getElementById(id);
  const prioInputs = () => document.querySelectorAll(".prio .line-input");
  const gratInputs = () => document.querySelectorAll(".grat .line-input");

  function renderTasks(){
    const box = $("tasks");
    box.innerHTML = "";
    state.tasks.forEach((task,i)=>{
      const row = document.createElement("div");
      row.className = "task" + (task.done ? " done" : "");
      row.innerHTML = `
        <button class="tick" aria-label="إنجاز"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></button>
        <span class="t-text" contenteditable="true">${task.t}</span>
        <button class="del" aria-label="حذف">✕</button>`;
      row.querySelector(".tick").addEventListener("click", ()=>{ task.done = !task.done; renderTasks(); commitSoon(); });
      row.querySelector(".del").addEventListener("click", ()=>{ state.tasks.splice(i,1); renderTasks(); commitSoon(); });
      row.querySelector(".t-text").addEventListener("blur", e=>{ task.t = e.target.textContent.trim() || task.t; commitSoon(); });
      box.appendChild(row);
    });
  }
  function addTask(){
    const inp = $("newTask");
    const v = inp.value.trim();
    if(!v) return;
    state.tasks.push({t:v, done:false});
    inp.value = "";
    renderTasks();
    inp.focus();
    commitEntry();
  }
  $("addTaskBtn").addEventListener("click", addTask);
  $("newTask").addEventListener("keydown", e=>{ if(e.key==="Enter") addTask(); });

  function renderStars(){
    document.querySelectorAll(".star-btn").forEach(b=>{
      b.classList.toggle("on", +b.dataset.v <= state.rating);
    });
  }
  document.querySelectorAll(".star-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      state.rating = (+b.dataset.v === state.rating) ? 0 : +b.dataset.v;
      renderStars(); commitEntry();
    });
  });

  document.querySelectorAll(".mood").forEach(m=>{
    m.addEventListener("click", ()=>{
      state.mood = (state.mood === m.dataset.mood) ? "" : m.dataset.mood;
      renderMood(); commitEntry();
    });
  });
  function renderMood(){
    document.querySelectorAll(".mood").forEach(m=>m.classList.toggle("sel", m.dataset.mood === state.mood));
  }

  /* صورة اليوم */
  const zone = $("photoZone");
  zone.addEventListener("click", e=>{ if(e.target.id!=="photoRemove") $("photoInput").click(); });
  $("photoInput").addEventListener("change", e=>{
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ev => { state.photo = ev.target.result; renderPhoto(); commitEntry(); };
    r.readAsDataURL(f);
  });
  $("photoRemove").addEventListener("click", e=>{
    e.stopPropagation();
    state.photo = ""; $("photoInput").value = ""; renderPhoto(); commitEntry();
  });
  function renderPhoto(){
    zone.querySelectorAll("img").forEach(i=>i.remove());
    if(state.photo){
      zone.classList.add("filled");
      const img = document.createElement("img");
      img.src = state.photo; img.alt = "صورة اليوم";
      zone.appendChild(img);
    } else zone.classList.remove("filled");
  }

  /* مرجع الأهداف — ربط اختياري بتدوينة اليوم */
  function renderGoalRef(){
    const box = $("goalRefChips");
    const active = (store.goals||[]).filter(g=>g.status==="جارٍ التنفيذ");
    if (!active.length){
      box.innerHTML = `<span class="gr-empty">لا توجد أهداف نشطة بعد</span>`;
      return;
    }
    box.innerHTML = active.map(g=>
      `<button class="gr-chip${state.linkedGoalId===g.id?" on":""}" data-id="${g.id}">${g.name}</button>`
    ).join("");
    box.querySelectorAll(".gr-chip").forEach(b=>{
      b.addEventListener("click", ()=>{
        state.linkedGoalId = (state.linkedGoalId === b.dataset.id) ? null : b.dataset.id;
        renderGoalRef(); commitEntry();
      });
    });
  }

  /* تركيز الأسبوع — مرجع ثابت + تأشير سريع لليوم */
  function renderFocusRef(){
    const wrap = $("focusRef");
    const items = (store.weeklyFocus && store.weeklyFocus.items) || [];
    if (!items.length){ wrap.hidden = true; return; }
    wrap.hidden = false;
    $("focusRefText").innerHTML = "🎯 تركيز الأسبوع: <b>" + items.map(it=>it.text).join(" · ") + "</b>";
    $("focusCheck").innerHTML = items.map((it,i)=>{
      const on = (it.checkedDates||[]).includes(selected);
      return `<button class="${on?"on":""}" data-i="${i}">${on?"التزمتُ ✓":"التزمتُ اليوم؟"}</button>`;
    }).join("");
    $("focusCheck").querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{
        const it = items[+b.dataset.i];
        it.checkedDates = it.checkedDates || [];
        const idx = it.checkedDates.indexOf(selected);
        if (idx > -1) it.checkedDates.splice(idx,1); else it.checkedDates.push(selected);
        renderFocusRef();
        window.RahlatiStore.touch(store, "week");
        window.RahlatiStore.save(store);
      });
    });
  }

  function fillForm(){
    $("intent").value = state.intent;
    prioInputs().forEach((el,i)=> el.value = state.priorities[i] || "");
    $("plan").value = state.plan;
    $("diary").value = state.diary;
    gratInputs().forEach((el,i)=> el.value = state.gratitude[i] || "");
    $("proud").value = state.proud;
    $("ratingNote").value = state.note;
    renderMood(); renderTasks(); renderStars(); renderPhoto(); renderGoalRef();
  }

  ["intent","plan","diary","proud","ratingNote"].forEach(id=>{
    $(id).addEventListener("input", e=>{
      const map = {intent:"intent", plan:"plan", diary:"diary", proud:"proud", ratingNote:"note"};
      state[map[id]] = e.target.value;
      commitSoon();
    });
  });
  prioInputs().forEach((el,i)=>{
    el.addEventListener("input", e=>{ state.priorities[i] = e.target.value; commitSoon(); });
  });
  gratInputs().forEach((el,i)=>{
    el.addEventListener("input", e=>{ state.gratitude[i] = e.target.value; commitSoon(); });
  });

  function selectDay(d){
    selected = d;
    const saved = findEntry(d);
    state = saved || blankEntry(d);
    renderHead(); renderCal(); fillForm(); renderFocusRef();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  /* ————— البحث ————— */
  $("searchInput").addEventListener("input", e=>{
    const q = e.target.value.trim();
    const box = $("searchResults");
    box.innerHTML = "";
    if(q.length < 2) return;
    const hits = store.journal
      .filter(v => (v.diary + " " + v.proud + " " + v.intent).includes(q))
      .sort((a,b)=> b.date.localeCompare(a.date));
    if(!hits.length){ box.innerHTML = `<div class="no-results">لا نتائج… جرّبي كلمةً أخرى</div>`; return; }
    hits.forEach(v=>{
      const d = v.date;
      const text = v.diary || v.proud;
      const idx = text.indexOf(q);
      const from = Math.max(0, idx - 25);
      let snip = (from>0?"…":"") + text.slice(from, idx + q.length + 45) + "…";
      snip = snip.replace(q, `<mark>${q}</mark>`);
      const dateLabel = new Intl.DateTimeFormat("ar-u-nu-arab",{weekday:"long", day:"numeric", month:"long"}).format(new Date(d+"T12:00:00"));
      const el = document.createElement("button");
      el.className = "result";
      el.innerHTML = `<div class="r-date">${dateLabel}</div><div class="r-text">${snip}</div>`;
      el.addEventListener("click", ()=>{
        const dd = new Date(d+"T12:00:00");
        calY = dd.getFullYear(); calM = dd.getMonth();
        selectDay(d);
      });
      box.appendChild(el);
    });
  });

  /* ————— الحفظ ————— */
  $("saveBtn").addEventListener("click", ()=>{
    commitEntry();
    toast("تم حفظ يومكِ ✦");
  });

  /* انطلاق */
  selectDay(selected);
</script>
</body>
</html>
